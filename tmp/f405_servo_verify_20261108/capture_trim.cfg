tcl port disabled
gdb port disabled
telnet port disabled
init
if {([mrw 0x40000800] & 1) == 0 || ([mrw 0x4000080c] & 0x200) == 0 ||
    ([mrw 0x40026010] & 1) == 0 || ([mrw 0x400264a0] & 1) == 0} {
  echo "Servo hardware schedule is not active"
  shutdown error
}
proc save_regs {addresses} {
  set result {}
  foreach address $addresses { lappend result [mrw $address] }
  return $result
}
proc restore_regs {addresses values} {
  foreach address $addresses value $values { mww $address $value }
}
proc sample_gpio {output} {
  set storage 0x2000a000
  set samples 40000
  set size [expr {$samples * 2}]
  set top [expr {$storage + $size + 256}]
  halt
  set fail [catch {
    set heap [mrw 0x200003e8]
    if {![regexp {(0x[0-9a-fA-F]+)} [reg msp] unused msp_hex] ||
        ![regexp {(0x[0-9a-fA-F]+)} [reg psp] unused psp_hex]} {
      error "Cannot locate target stacks"
    }
    set msp $msp_hex
    set psp $psp_hex
    if {$heap > $storage || $msp < $top || ($psp != 0 && $psp < $top)} {
      error "The spare SRAM range overlaps live data"
    }
    if {[mrw 0x40026428] & 1} { error "DMA2 stream 1 is occupied" }
    set apb1fz 0xe0042008
    set apb2fz 0xe004200c
    set t8 0x40010400
    set tim_addrs {0x40010400 0x40010408 0x4001040c 0x40010410 0x40010420 0x40010424 0x40010428 0x4001042c 0x40010430}
    set tim_saved [save_regs $tim_addrs]
    set dma_addrs {0x40026428 0x4002642c 0x40026430 0x40026434 0x40026438 0x4002643c}
    set dma_saved [save_regs $dma_addrs]
    set fz_addrs [list $apb1fz $apb2fz]
    set fz_saved [save_regs $fz_addrs]
    set capture_failed [catch {
      mww $apb1fz [expr {[lindex $fz_saved 0] & ~4}]
      mww $apb2fz [expr {[lindex $fz_saved 1] & ~2}]
      mww 0x40010400 0
      mww 0x4001040c 0
      mww 0x40010420 0
      mww 0x40010408 0
      mww 0x40010428 0
      mww 0x4001042c 167
      mww 0x40010430 0
      mww 0x40010414 1
      mww 0x40026408 0x0f40
      mww 0x4002642c $samples
      mww 0x40026430 0x40020810
      mww 0x40026434 $storage
      mww 0x4002643c 0
      mww 0x40026428 0x0e002c01
      mww 0x4001040c 0x100
      mww 0x40010400 1
      sleep 62
      set left [mrw 0x4002642c]
      set flags [expr {[mrw 0x40026400] & 0x0f40}]
      echo [format "PIN_SAMPLE count=%u remaining=%u flags=0x%04x" $samples $left $flags]
      if {$left != 0 || ($flags & 0x340) != 0 || ($flags & 0x800) == 0} {
        error "GPIO sample transfer failed"
      }
    } cap_reason]
    mww 0x40010400 0
    mww 0x4001040c 0
    mww 0x40026428 0
    restore_regs [lrange $dma_addrs 1 end] [lrange $dma_saved 1 end]
    mww 0x40026408 0x0f40
    mww 0x40026428 [lindex $dma_saved 0]
    mww 0x40010428 [lindex $tim_saved 6]
    mww 0x4001042c [lindex $tim_saved 7]
    mww 0x40010430 [lindex $tim_saved 8]
    mww 0x40010414 1
    mww 0x40010424 [lindex $tim_saved 5]
    mww 0x40010410 [lindex $tim_saved 3]
    mww 0x40010420 [lindex $tim_saved 4]
    mww 0x40010408 [lindex $tim_saved 1]
    mww 0x4001040c [lindex $tim_saved 2]
    mww 0x40010400 [lindex $tim_saved 0]
    restore_regs $fz_addrs $fz_saved
    if {$capture_failed} { error $cap_reason }
  } reason]
  resume
  if {$fail} { error $reason }
  dump_image $output $storage $size
  echo "PIN_SAMPLE restored TIM8 and resumed app"
}

sample_gpio {tmp/f405_servo_verify_20261108/trim.bin}
shutdown
