# Read-only audit; never stop/reset/write the target or clear status flags.
source tools/F405ClawCalibrator.tcl
echo "IDENT_RCC"
mdw 0xe0042000 1
mdw 0x40023800 3
echo "TIM4"
mdw 0x40000800 16
echo "TIM1"
mdw 0x40010000 16
echo "DMA1_S0"
mdw 0x40026000 2
mdw 0x40026010 6
echo "DMA2_S6"
mdw 0x40026400 2
mdw 0x400264a0 6
echo [servo_readall]
lassign [f405_servo_table] ticks edges
echo "TIMING_TABLE"
mdw $ticks 8
echo "GPIO_TABLE"
mdw $edges 8
for {set i 0} {$i < 8} {incr i} {
 set cnt [mrw 0x40000824]
 set nd1 [mrw 0x40026014]
 set ccr [mrw 0x40000834]
 set nd2 [mrw 0x400264a4]
 set cnt2 [mrw 0x40000824]
 echo "SNAP $i CNT=$cnt/$cnt2 D1=$nd1 CCR1=$ccr D2=$nd2"
 sleep 17
}
echo "ERROR_FLAGS_AFTER"
mdw 0x40026000 2
mdw 0x40026400 2
dump_image tmp/servo_dma_audit_20261116/actual_flash.bin 0x08000000 0x30000
shutdown

