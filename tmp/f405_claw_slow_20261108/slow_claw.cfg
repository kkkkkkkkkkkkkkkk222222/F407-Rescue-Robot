proc delay_unless_stopped {ms flag} {
  while {$ms > 0} {
    if {[file exists $flag]} { return 0 }
    set part [expr {$ms < 50 ? $ms : 50}]
    sleep $part
    set ms [expr {$ms-$part}]
  }
  return [expr {![file exists $flag]}]
}
proc slew_claw {address goal step interval flag} {
  set value [mrw $address]
  while {$value != $goal} {
    if {[file exists $flag]} { return 0 }
    if {$value < $goal} {
      set next [expr {$value+$step > $goal ? $goal : $value+$step}]
    } else {
      set next [expr {$value-$step < $goal ? $goal : $value-$step}]
    }
    mww $address $next
    set value [mrw $address]
    if {$value != $next} { error "S4 target was overwritten during test" }
    if {![delay_unless_stopped $interval $flag]} { return 0 }
  }
  return 1
}
proc stop_trial {address} {
  echo [format "SLOW_STOPPED pulse_us=%u" [expr {[mrw $address]-15100}]]
  shutdown
}
