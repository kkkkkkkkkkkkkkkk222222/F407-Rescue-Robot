# 左爪 S4 空载短测。保存后双击同目录的 Start.cmd。
# 关闭占用 COM18 的串口助手连接。测试会进入 DEBUG，右爪 S2 置 90 度。
# StartDeg 和 EndDeg 是逻辑角。LeftTrimDeg 用于测试换算，请填你的左爪偏移。
# 正常结束小步回到启动前的左爪位置。双击 Stop.cmd 可保持当前脉宽并停止变化。
Port=COM18
StartDeg=18
EndDeg=22
LeftTrimDeg=5
# StepDeg 为目标步幅（度），按整微秒向下换算，实际步幅显示在窗口里。
# IntervalMs 为步间隔，最短 20 ms（一帧 PWM）。步幅与间隔组合限 60 度/120 ms。
StepDeg=0.18
IntervalMs=300
# 每到一端停留的毫秒数。Cycles=1 表示往返一次。
HoldMs=3000
Cycles=1
