# Silence OpenOCD 0.12 deprecation warnings emitted by CLion's legacy port commands.
rename tcl_port {}
proc tcl_port {args} { eval tcl port $args }
rename gdb_port {}
proc gdb_port {args} { eval gdb port $args }
rename telnet_port {}
proc telnet_port {args} { eval telnet port $args }

# Horco / YLJ2000 CMSIS-DAP v2 -> STM32F407
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 2000
source [find target/stm32f4x.cfg]
